require conf/distro/poky.conf

DISTRO = "oneo"
DISTRO_NAME = "One-O Linux"
DISTRO_VERSION = "0.1.0"
SDK_VENDOR = "-oneosdk"
MAINTAINER = "yocto-bsp-lead"

# Features: no X11/Wayland (EGLFS single app, ADR-001), no network stack extras in R1
DISTRO_FEATURES = "systemd usrmerge opengl bluetooth usbhost pipewire alsa ipv4 pam ${DISTRO_FEATURES_LIBC}"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Toolchain
GCCVERSION ?= "13.%"
require conf/distro/include/no-static-libs.inc

# Read-only verity rootfs; /data is the only writable store (ADR-005)
EXTRA_IMAGE_FEATURES = ""
IMAGE_FSTYPES = "ext4 wic.zst"

# Security / signing (keys supplied by OEM release process, never in repo; REQ-403)
RAUC_KEY_FILE ?= ""
RAUC_CERT_FILE ?= ""
ONEO_FIT_SIGN_KEYDIR ?= ""
ONEO_VERITY ?= "1"

# Build hygiene
INHERIT += "rm_work create-spdx"
LICENSE_FLAGS_ACCEPTED += "commercial"
PREFERRED_PROVIDER_virtual/kernel ?= "linux-imx"
